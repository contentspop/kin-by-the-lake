<script type="text/babel">
function KinSite() {
  const { NavBar, Button } = KS;
  const [page, setPage] = React.useState(() => 'home');
  const [lang, setLang] = React.useState('en');
  const [scrolled, setScrolled] = React.useState(false);
  const [narrow, setNarrow] = React.useState(window.innerWidth < 768);
  React.useEffect(() => { const s = () => setScrolled(window.scrollY > 80); const r = () => setNarrow(window.innerWidth < 768); window.addEventListener('scroll', s); window.addEventListener('resize', r); return () => { window.removeEventListener('scroll', s); window.removeEventListener('resize', r); }; }, []);
  const go = (p) => { const k = ['home', 'menu', 'story', 'reserve'].includes(p) ? p : (p === 'pavilion' || p === 'visit' ? 'story' : p === 'events' ? 'home' : 'home'); setPage(k); localStorage.setItem('kin-page', k); window.scrollTo(0, 0); };
  const overHero = page === 'home' && !scrolled;
  const Screen = { home: HomeScreen, menu: MenuScreen, story: StoryScreen, reserve: ReserveScreen }[page];
  return (<>
    <div style={{ position: 'sticky', top: 0, zIndex: 20, background: overHero ? 'transparent' : 'var(--stone-50)', transition: 'background var(--motion-base) var(--motion-ease)' }}>
      <NavBar active={page} onNavigate={go} onReserve={() => go('reserve')} inverse={overHero} lang={lang} onLangChange={setLang} assetBase={A_LOGO} compact={narrow} />
    </div>
    <main><Screen go={go} lang={lang} /></main>
    <Footer onNavigate={go} />
    {narrow && page !== 'reserve' ? <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, height: 60, background: 'var(--lake-600)', display: 'flex', alignItems: 'center', padding: '0 12px', zIndex: 30 }}><Button inverse full size="sm" onClick={() => go('reserve')}>Reserve a table</Button></div> : null}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<KinSite />);
